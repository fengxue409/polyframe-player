<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PolyFrame Player</title>
    <script>
      // P34 首帧防闪：必须在样式生效前定好主题，否则会先画一帧深色再跳成亮色。
      // 键名与 stores/theme.ts 的 THEME_KEY 必须一致。
      try {
        document.documentElement.dataset.theme = localStorage.getItem('pf.theme') === 'light' ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
